<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto: Esteganografía en Audius</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Banner CSS Personalizado */
        #secret-banner {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border-radius: 16px;
            padding: 3px;
            display: none; /* Oculto hasta que se resuelva el reto */
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.5);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .banner-content {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 2rem;
            height: 100%;
        }

        h1 {
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #94a3b8;
            margin-bottom: 1rem;
            margin-top: 0;
        }

        #secret-word {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            word-wrap: break-word;
        }

        .status {
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div id="status-container" class="status">
        Conectando a la matriz de Audius...
    </div>

    <div id="secret-banner">
        <div class="banner-content">
            <h1>Mensaje Oculto Encontrado</h1>
            <p id="secret-word">...</p>
        </div>
    </div>

    <script>
        const NOMBRE_DEL_EPISODIO = "el-código-en-el-ruido"; 
        const APP_NAME = "EsteganografiaApp";

        async function resolverReto() {
            try {
                const hostResponse = await fetch('https://api.audius.co');
                const hostData = await hostResponse.json();
                const host = hostData.data[0]; 

                const searchUrl = `${host}/v1/tracks/search?query=${encodeURIComponent(NOMBRE_DEL_EPISODIO)}&app_name=${APP_NAME}`;
                const trackResponse = await fetch(searchUrl);
                const trackData = await trackResponse.json();

                console.log("=== JSON RECIBIDO DEL SERVIDOR DE AUDIUS ===");
                console.log(trackData);
                console.log("============================================");

                if (trackData.data && trackData.data.length > 0) {
                    const episodio = trackData.data[0];
                    let palabraOculta = "";

                    if (episodio.tags) {
                        const tagsArray = typeof episodio.tags === 'string' ? episodio.tags.split(',') : episodio.tags;
                        palabraOculta = tagsArray[tagsArray.length - 1]; 
                    } 
                    
                    if (!palabraOculta && episodio.description) {
                        const match = episodio.description.match(/\[(.*?)\]/);
                        if (match) palabraOculta = match[1];
                    }

                    if (!palabraOculta) {
                        palabraOculta = episodio.tags || "Palabra no detectada en metadatos.";
                    }

                    document.getElementById('status-container').style.display = 'none';
                    const banner = document.getElementById('secret-banner');
                    const secretWordElement = document.getElementById('secret-word');
                    
                    secretWordElement.textContent = palabraOculta;
                    banner.style.display = 'block';

                } else {
                    document.getElementById('status-container').textContent = "No se encontró el episodio. Verifica el nombre en la variable NOMBRE_DEL_EPISODIO.";
                }

            } catch (error) {
                console.error("Error al acceder a la API:", error);
                document.getElementById('status-container').textContent = "Error de conexión. Revisa la consola para más detalles.";
            }
        }

        resolverReto();
    </script>
</body>
</html>
